name: AuthAPI CI - Build and Push to ACR

on:
  push:
    paths:
      - "CoffeeShop/**"
      - ".github/workflows/authapi-ci.yml"
    branches:
      - main

jobs:
    build-and-push:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Azure Login
          uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}
  
        - name: Docker login to ACR
          uses: docker/login-action@v3
          with:
            registry: ${{ secrets.ACR_LOGIN_SERVER }}
            username: ${{ secrets.ACR_NAME }}
            password: ${{ secrets.AZURE_CREDENTIALS_PASSWORD }}


